name: Vigilante AEMET

on:
  schedule:
    - cron: "3-59/10 * * * *"   # cada 10 min, en minutos :03 :13 :23... (evita el pico de :00 de GitHub)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar 3 notificaciones de prueba (Madrid, Corredor, Rivas)"
        type: boolean
        default: false
      resumen:
        description: "Enviar además un resumen de la situación actual"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar imágenes de radar anteriores
        uses: actions/cache/restore@v4
        with:
          path: site/radar
          key: radar-${{ github.run_id }}
          restore-keys: radar-

      - name: Comprobar avisos y ríos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          MODO_PRUEBA: ${{ inputs.prueba && '1' || '0' }}
          MODO_RESUMEN: ${{ inputs.resumen && '1' || '0' }}
        run: python monitor/monitor.py

      - name: Guardar estado
        if: ${{ !inputs.prueba }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vigilante-aemet"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar estado de avisos"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Guardar imágenes de radar
        if: ${{ !inputs.prueba && always() }}
        uses: actions/cache/save@v4
        with:
          path: site/radar
          key: radar-${{ github.run_id }}

      - name: Preparar panel
        if: ${{ !inputs.prueba }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar panel
        id: deploy
        if: ${{ !inputs.prueba }}
        uses: actions/deploy-pages@v4
